name: Quality Guardian TT2

on:
  push:
    branches: [ "main", "refactor/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # 1. DISK CLEANUP (Frees up ~20GB of space by removing unused server tools)
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@v1.3.1
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    # 2. ENVIRONMENT FIX: Install base Linux dependencies required for Computer Vision
    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    # 3. PYTHON INSTALLATION
    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        # PRO TIP: Install CPU-only Torch to fit within the runner's storage limits
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    # 4. LINTING
    - name: Syntax Analysis (Linting)
      run: |
        flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. TESTS
    - name: Run Tests with Pytest
      run: |
        export PYTHONPATH=$PYTHONPATH:$(pwd)/backend
        pytest backend/tests/test_websockets.py